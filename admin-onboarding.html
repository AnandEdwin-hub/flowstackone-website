<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowstackONE — Onboarding Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #0B0D0E;
    --text:    #FAFAF7;
    --muted:   #7A8087;
    --surface: #14171A;
    --border:  #2A3036;
    --green:   #4CAF7D;
    --red:     #E07A5F;
    --font:    'Segoe UI', system-ui, sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 48px 24px;
  }

  h1 {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 40px;
  }

  #login-screen {
    max-width: 360px;
    margin: 120px auto;
    text-align: center;
  }

  #login-screen h2 {
    font-size: 20px;
    margin-bottom: 24px;
  }

  input[type="password"], input[type="text"] {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    padding: 12px 16px;
    border-radius: 6px;
    outline: none;
    margin-bottom: 12px;
  }
  input:focus { border-color: rgba(250,250,247,0.4); }

  button {
    background: var(--text);
    color: var(--bg);
    font-family: var(--font);
    font-size: 14px;
    font-weight: 700;
    padding: 12px 24px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-full { width: 100%; }
  .btn-approve { background: var(--green); color: #fff; }
  .btn-reject  { background: transparent; color: var(--red); border: 1.5px solid var(--red); }

  .error-text {
    color: var(--red);
    font-size: 13px;
    margin-top: 8px;
    display: none;
  }

  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
    padding: 10px 16px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--text); }

  .request-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px;
    margin-bottom: 16px;
  }

  .request-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 8px;
  }

  .request-business {
    font-size: 17px;
    font-weight: 700;
  }

  .request-type {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    background: rgba(255,255,255,0.06);
    padding: 4px 10px;
    border-radius: 12px;
    margin-top: 6px;
  }

  .status-badge {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 12px;
  }
  .status-pending   { background: rgba(255,193,7,0.15); color: #FFC107; }
  .status-approved,
  .status-converted { background: rgba(76,175,125,0.15); color: var(--green); }
  .status-rejected  { background: rgba(224,122,95,0.15); color: var(--red); }

  .request-details {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .request-details div { margin-bottom: 4px; }
  .request-details strong { color: var(--text); }

  .request-actions {
    display: flex;
    gap: 12px;
  }

  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 14px 24px;
    border-radius: 8px;
    font-size: 14px;
    display: none;
    z-index: 200;
  }
  .toast.show { display: block; }
  .toast.success { border-color: var(--green); color: var(--green); }
  .toast.error { border-color: var(--red); color: var(--red); }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 300;
    padding: 24px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 28px;
    max-width: 400px;
    width: 100%;
  }
  .modal-box h3 { margin-bottom: 16px; font-size: 16px; }
  .modal-actions { display: flex; gap: 12px; margin-top: 16px; }
</style>
</head>
<body>

<div id="login-screen">
  <h2>FlowstackONE Admin</h2>
  <input type="password" id="password-input" placeholder="Enter admin password">
  <button class="btn-full" id="login-btn">Log in</button>
  <p class="error-text" id="login-error">Incorrect password.</p>
</div>

<div class="container" id="main-app" style="display:none;">
  <h1>Onboarding Requests</h1>
  <p class="subtitle">Review and approve new FlowstackONE signups.</p>

  <div class="tabs">
    <button class="tab active" data-filter="pending">Pending</button>
    <button class="tab" data-filter="converted">Approved</button>
    <button class="tab" data-filter="rejected">Rejected</button>
    <button class="tab" data-filter="all">All</button>
  </div>

  <div id="requests-list"></div>
</div>

<div class="modal-overlay" id="reject-modal">
  <div class="modal-box">
    <h3>Reject this request?</h3>
    <input type="text" id="reject-reason-input" placeholder="Reason (optional)">
    <div class="modal-actions">
      <button class="btn-reject" id="confirm-reject-btn" style="flex:1;">Confirm reject</button>
      <button id="cancel-reject-btn" style="flex:1; background:var(--border); color:var(--text);">Cancel</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const FUNCTIONS_BASE = 'https://erkvzrluoyhxgohjbqxu.supabase.co/functions/v1';
  let adminPassword = '';
  let allRequests = [];
  let currentFilter = 'pending';
  let pendingRejectId = null;

  const loginScreen = document.getElementById('login-screen');
  const mainApp = document.getElementById('main-app');
  const passwordInput = document.getElementById('password-input');
  const loginBtn = document.getElementById('login-btn');
  const loginError = document.getElementById('login-error');
  const requestsList = document.getElementById('requests-list');
  const toast = document.getElementById('toast');
  const rejectModal = document.getElementById('reject-modal');

  function showToast(message, type) {
    toast.textContent = message;
    toast.className = 'toast show ' + type;
    setTimeout(() => { toast.className = 'toast'; }, 3500);
  }

  async function login() {
    const pwd = passwordInput.value.trim();
    if (!pwd) return;

    loginBtn.disabled = true;
    loginBtn.textContent = 'Checking...';
    loginError.style.display = 'none';

    try {
      const res = await fetch(FUNCTIONS_BASE + '/list-onboarding-requests', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pwd }),
      });
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || 'Login failed');
      }

      adminPassword = pwd;
      allRequests = data.requests;
      loginScreen.style.display = 'none';
      mainApp.style.display = 'block';
      renderRequests();
    } catch (err) {
      loginError.textContent = err.message === 'Invalid password' ? 'Incorrect password.' : err.message;
      loginError.style.display = 'block';
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = 'Log in';
    }
  }

  async function refreshRequests() {
    const res = await fetch(FUNCTIONS_BASE + '/list-onboarding-requests', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: adminPassword }),
    });
    const data = await res.json();
    if (res.ok) {
      allRequests = data.requests;
      renderRequests();
    }
  }

  function renderRequests() {
    let filtered;
    if (currentFilter === 'all') {
      filtered = allRequests;
    } else if (currentFilter === 'converted') {
      filtered = allRequests.filter(r => r.status === 'converted' || r.status === 'approved');
    } else {
      filtered = allRequests.filter(r => r.status === currentFilter);
    }

    if (filtered.length === 0) {
      requestsList.innerHTML = '<div class="empty-state">No requests here.</div>';
      return;
    }

    requestsList.innerHTML = filtered.map(r => `
      <div class="request-card">
        <div class="request-header">
          <div>
            <div class="request-business">${escapeHtml(r.business_name)}</div>
            <span class="request-type">${escapeHtml(r.smb_type)}</span>
          </div>
          <span class="status-badge status-${r.status}">${r.status}</span>
        </div>
        <div class="request-details">
          <div><strong>Contact:</strong> ${escapeHtml(r.contact_name)}</div>
          <div><strong>Email:</strong> ${escapeHtml(r.email)}</div>
          <div><strong>Phone:</strong> ${escapeHtml(r.phone || 'Not provided')}</div>
          ${r.message ? `<div><strong>Message:</strong> ${escapeHtml(r.message)}</div>` : ''}
          <div><strong>Submitted:</strong> ${new Date(r.created_at).toLocaleString()}</div>
          ${r.reviewed_by ? `<div><strong>Reviewed by:</strong> ${escapeHtml(r.reviewed_by)}</div>` : ''}
          ${r.rejection_reason ? `<div><strong>Rejection reason:</strong> ${escapeHtml(r.rejection_reason)}</div>` : ''}
        </div>
        ${r.status === 'pending' ? `
          <div class="request-actions">
            <button class="btn-approve" onclick="approveRequest('${r.id}')">Approve</button>
            <button class="btn-reject" onclick="openRejectModal('${r.id}')">Reject</button>
          </div>
        ` : ''}
      </div>
    `).join('');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function approveRequest(id) {
    const reviewer = prompt('Your name (for the record):', '');
    if (reviewer === null) return;

    showToast('Approving...', 'success');

    try {
      const res = await fetch(FUNCTIONS_BASE + '/approve-onboarding', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: adminPassword, request_id: id, reviewed_by: reviewer || 'unknown' }),
      });
      const data = await res.json();

      if (!res.ok) throw new Error(data.error || 'Approval failed');

      showToast('Approved! Welcome email sent.', 'success');
      refreshRequests();
    } catch (err) {
      showToast('Error: ' + err.message, 'error');
    }
  }

  function openRejectModal(id) {
    pendingRejectId = id;
    document.getElementById('reject-reason-input').value = '';
    rejectModal.classList.add('open');
  }

  function closeRejectModal() {
    rejectModal.classList.remove('open');
    pendingRejectId = null;
  }

  async function confirmReject() {
    const reviewer = prompt('Your name (for the record):', '');
    if (reviewer === null) return;

    const reason = document.getElementById('reject-reason-input').value.trim();

    try {
      const res = await fetch(FUNCTIONS_BASE + '/reject-onboarding', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          password: adminPassword,
          request_id: pendingRejectId,
          reviewed_by: reviewer || 'unknown',
          rejection_reason: reason,
        }),
      });
      const data = await res.json();

      if (!res.ok) throw new Error(data.error || 'Rejection failed');

      showToast('Request rejected.', 'success');
      closeRejectModal();
      refreshRequests();
    } catch (err) {
      showToast('Error: ' + err.message, 'error');
    }
  }

  loginBtn.addEventListener('click', login);
  passwordInput.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentFilter = tab.dataset.filter;
      renderRequests();
    });
  });

  document.getElementById('confirm-reject-btn').addEventListener('click', confirmReject);
  document.getElementById('cancel-reject-btn').addEventListener('click', closeRejectModal);
</script>

</body>
</html>
